# =======================================================
# nginx-frontend.conf
# This file goes INSIDE the frontend Docker container
# It tells the NGINX inside the container how to serve React
# This is DIFFERENT from the NGINX on your EC2 server
# =======================================================

server {
    # Listen on port 80 inside the container
    listen 80;

    # Where the built React files are (we copied them here in Dockerfile)
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    # Health check endpoint
    # The Dockerfile HEALTHCHECK hits this to know if container is alive
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;   # don't log health checks — keeps logs clean
    }

    # Proxy API calls to the backend container.
    # "backend" resolves via Docker's internal DNS to the backend service
    # defined in docker-compose.yml. Without this, the frontend's relative
    # "/api/..." fetches have nowhere to go but back to this same nginx,
    # which would just serve index.html (see the SPA fallback below).
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.IO's realtime connection (including the WebSocket upgrade)
    # to the backend container.
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Static assets — JS, CSS, images, fonts
    # These have hashed names (main.abc123.js) so safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router support — THE most important rule
    # When user visits /dashboard or /profile:
    #   → no actual file exists for those paths
    #   → serve index.html instead
    #   → React Router reads the URL and renders the right component
    # Without this, refreshing any page except / gives 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression — smaller files = faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1024;
}